name: Build vlmcsd for OpenWrt 25.12.2 x86_64

on:
  push:
    branches: [ vlmcsd-release ]
    paths:
      - '.github/workflows/build-vlmcsd.yml'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本号'
        required: true
        default: '25.12.2'
      target:
        description: '目标平台 (target/subtarget)'
        required: true
        default: 'x86/64'
      vlmcsd_repo:
        description: 'vlmcsd 包源码仓库'
        required: true
        default: 'https://github.com/cokebar/openwrt-vlmcsd.git'
      vlmcsd_branch:
        description: 'vlmcsd 分支/标签'
        required: true
        default: 'master'
      create_release:
        description: '是否创建 GitHub Release'
        type: boolean
        default: true

env:
  OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '25.12.2' }}
  TARGET: ${{ github.event.inputs.target || 'x86/64' }}
  VLMCSD_REPO: ${{ github.event.inputs.vlmcsd_repo || 'https://github.com/cokebar/openwrt-vlmcsd.git' }}
  VLMCSD_BRANCH: ${{ github.event.inputs.vlmcsd_branch || 'master' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
            python3-pyelftools unzip wget rsync subversion swig time xsltproc zlib1g-dev \
            zstd

      - name: 解析目标平台信息
        id: parse
        run: |
          TARGET_ARCH=$(echo "$TARGET" | cut -d'/' -f1)
          SUBTARGET=$(echo "$TARGET" | cut -d'/' -f2)
          echo "target_arch=$TARGET_ARCH" >> $GITHUB_OUTPUT
          echo "subtarget=$SUBTARGET" >> $GITHUB_OUTPUT
          
          SDK_BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET_ARCH}/${SUBTARGET}/"
          echo "sdk_base_url=$SDK_BASE_URL" >> $GITHUB_OUTPUT
          
          # 获取 SDK 文件名
          SDK_FILENAME=$(curl -sL "$SDK_BASE_URL" | grep -oP 'openwrt-sdk-[^"]+\.tar\.zst' | head -1)
          if [ -z "$SDK_FILENAME" ]; then
            echo "::error::无法找到 SDK 文件，请检查版本和目标平台"
            exit 1
          fi
          echo "sdk_filename=$SDK_FILENAME" >> $GITHUB_OUTPUT
          echo "SDK 文件名: $SDK_FILENAME"

      - name: 缓存 SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: openwrt-sdk-${{ env.OPENWRT_VERSION }}-${{ steps.parse.outputs.target_arch }}-${{ steps.parse.outputs.subtarget }}

      - name: 下载并解压 OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          SDK_URL="${{ steps.parse.outputs.sdk_base_url }}${{ steps.parse.outputs.sdk_filename }}"
          echo "下载 SDK: $SDK_URL"
          
          wget -q "$SDK_URL" -O sdk.tar.zst
          
          # 解压
          mkdir -p sdk
          tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1
          
          echo "SDK 解压完成"
          ls sdk/

      - name: 引入 vlmcsd 包源码并修复版本号
        working-directory: sdk
        run: |
          # 清理已存在的 vlmcsd 目录（缓存命中时会有残留）
          rm -rf package/vlmcsd
          
          # 克隆 vlmcsd 到 package 目录
          git clone --depth 1 -b "$VLMCSD_BRANCH" "$VLMCSD_REPO" package/vlmcsd
          
          # ===== 关键修复：适配 OpenWrt 25.12.x apk 格式的版本号要求 =====
          # apk 版本号必须以数字开头，svn1113 不符合规范，改为 1113
          sed -i 's/PKG_VERSION:=svn1113/PKG_VERSION:=1113/' package/vlmcsd/Makefile
          
          # 固定源码下载文件名（保持原 svn1113.tar.gz）
          sed -i 's/PKG_SOURCE:=$(PKG_VERSION).tar.gz/PKG_SOURCE:=svn1113.tar.gz/' package/vlmcsd/Makefile
          
          # 构建目录保持原名（确保源码解压路径正确）
          sed -i 's|PKG_BUILD_DIR:=$(BUILD_DIR)/$(PKG_NAME)-$(PKG_VERSION)|PKG_BUILD_DIR:=$(BUILD_DIR)/$(PKG_NAME)-svn1113|' package/vlmcsd/Makefile
          
          echo "=== 修复后的 Makefile 版本相关行 ==="
          grep -E "PKG_VERSION|PKG_SOURCE|PKG_BUILD_DIR" package/vlmcsd/Makefile
          echo "vlmcsd 包源码已引入"
          ls -la package/vlmcsd/
          echo "=== 完整 Makefile ==="
          cat package/vlmcsd/Makefile

      - name: 更新 feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 配置编译选项
        working-directory: sdk
        run: |
          # 生成默认配置
          make defconfig
          
          # 启用 vlmcsd 为模块（M）
          if grep -q "CONFIG_PACKAGE_vlmcsd" .config; then
            sed -i 's/# CONFIG_PACKAGE_vlmcsd is not set/CONFIG_PACKAGE_vlmcsd=m/' .config
          else
            echo "CONFIG_PACKAGE_vlmcsd=m" >> .config
          fi
          
          # 重新生成配置
          make defconfig
          
          # 验证配置
          echo "=== vlmcsd 配置 ==="
          grep "vlmcsd" .config || echo "未找到 vlmcsd 配置项"

      - name: 编译 vlmcsd
        working-directory: sdk
        run: |
          # 编译 vlmcsd 及其依赖
          make package/vlmcsd/compile V=s -j$(nproc)
          
          echo "=== 编译完成，查找产物 ==="
          find bin/ -name "vlmcsd_*.apk" -type f
          echo "=== 编译退出码: $? ==="
          echo "=== 查找所有 apk 文件 ==="
          find bin/ -name "*.apk" -type f 2>/dev/null
          echo "=== 查找 vlmcsd 相关文件 ==="
          find bin/ -iname "*vlmcsd*" -type f 2>/dev/null
          echo "=== 查看 build_dir 状态 ==="
          ls -la build_dir/target-x86_64_musl/vlmcsd-*/ 2>/dev/null || echo "build_dir 中没有 vlmcsd"

      - name: 收集编译产物
        run: |
          mkdir -p output
          # 全面查找 vlmcsd apk（不限制路径深度）
          find sdk/ -name "*vlmcsd*.apk" -type f -exec cp {} output/ \;
          echo "=== 产物列表 ==="
          ls -lh output/
          # 兜底：如果为空，打印所有 apk 位置
          if [ ! -s output/ ] || [ -z "$(ls -A output/)" ]; then
            echo "::warning::未找到 vlmcsd，所有 apk 位置："
            find sdk/bin/ -name "*.apk" -type f
          fi          
          echo "=== 产物列表 ==="
          ls -lh output/

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlmcsd-${{ env.OPENWRT_VERSION }}-${{ steps.parse.outputs.target_arch }}-${{ steps.parse.outputs.subtarget }}
          path: output/
          retention-days: 30

      # ========== 以下为新增的 Release 发布步骤 ==========

      - name: 生成 Release 说明
        if: ${{ github.event.inputs.create_release == 'true' || github.event_name == 'push' }}
        run: |
          APK_FILE=$(ls output/*.apk 2>/dev/null | head -1)
          APK_NAME=$(basename "$APK_FILE" 2>/dev/null)
          APK_SIZE=$(ls -lh "$APK_FILE" 2>/dev/null | awk '{print $5}')
          
          cat > release.txt << EOF
          ## vlmcsd for OpenWrt ${{ env.OPENWRT_VERSION }}
          
          ### 编译信息
          | 项目 | 值 |
          |------|-----|
          | OpenWrt 版本 | ${{ env.OPENWRT_VERSION }} |
          | 目标平台 | ${{ env.TARGET }} |
          | 架构 | x86_64 |
          | vlmcsd 版本 | 1113-r1 |
          | 包格式 | apk |
          | 文件名 | $APK_NAME |
          | 文件大小 | $APK_SIZE |
          
          ### 安装方法
          \`\`\`bash
          # 上传到路由器后安装
          scp $APK_NAME root@192.168.1.1:/tmp/
          ssh root@192.168.1.1
          apk add /tmp/$APK_NAME
          
          # 启用并启动服务
          /etc/init.d/vlmcsd enable
          /etc/init.d/vlmcsd start
          
          # 验证服务状态
          netstat -tlnp | grep 1688
          \`\`\`
          
          ### 包内容
          - \`/usr/bin/vlmcsd\` - KMS 服务端主程序
          - \`/usr/bin/vlmcs\` - KMS 客户端测试工具
          - \`/etc/vlmcsd.ini\` - 配置文件
          - \`/etc/vlmcsd.kmd\` - KMS 数据文件
          - \`/etc/init.d/vlmcsd\` - 启动脚本
          
          ### 依赖
          - libc（系统内置）
          - libpthread（系统内置）
          
          > 自动编译于 GitHub Actions
          > 编译时间: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
          
          echo "=== Release 说明已生成 ==="
          cat release.txt

      - name: 发布到 GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' || github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: vlmcsd-${{ env.OPENWRT_VERSION }}-x86_64
          name: vlmcsd ${{ env.OPENWRT_VERSION }} (x86_64)
          body_path: release.txt
          files: output/*.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
