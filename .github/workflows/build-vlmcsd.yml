name: Build vlmcsd apk for OpenWrt x86/64

on:
  workflow_dispatch:          # 手动触发
  push:
    paths:
      - '.github/workflows/build-vlmcsd.yml'  # 工作流自身变更时触发
  schedule:
    - cron: '0 0 1 * *'       # 每月1日自动编译（可选）

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install build dependencies
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install autoconf automake binutils bison build-essential bzip2 cpio curl flex gawk gettext gcc-multilib g++-multilib git haveged libncurses5-dev libncursesw5-dev libpython3-dev libssl-dev libtool p7zip p7zip-full patch pkgconf python3 python3-setuptools rsync squashfs-tools swig texinfo upx-ucl unzip vim wget xxd zlib1g-dev clang g++ file libncurses-dev subversion gettext python3 python3-distutils wget xz-utils

      - name: Download OpenWrt SDK for x86/64
        run: |
          # 下载主线快照 SDK（可调整为固定版本）
          SDK_URL="https://archive.openwrt.org/releases/25.12.2/targets/x86/64/openwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget -q "$SDK_URL" -O sdk.tar.zst
          tar --zstd -xf sdk.tar.zst
          echo "SDK_DIR=$(ls -d openwrt-sdk-* | head -1)" >> $GITHUB_ENV


      - name: Add vlmcsd package
        run: |
          git clone --depth=1 https://github.com/cokebar/openwrt-vlmcsd.git
          mkdir -p $SDK_DIR/package/vlmcsd
          # cp -r openwrt-vlmcsd/vlmcsd $SDK_DIR/package/
          cp -r openwrt-vlmcsd/* $SDK_DIR/package/vlmcsd/
          # 修正 Makefile：使用有效的 Git 标签，并调整版本号符合 APK 规范
          cd $SDK_DIR/package/vlmcsd
          sed -i 's/^PKG_VERSION:=.*/PKG_VERSION:=1112/' Makefile
          sed -i 's/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=svn1112/' Makefile
          # 确保通过 Git 获取源码
          if grep -q "^PKG_SOURCE_PROTO" Makefile; then
            sed -i 's/^PKG_SOURCE_PROTO:=.*/PKG_SOURCE_PROTO:=git/' Makefile
          else
            echo "PKG_SOURCE_PROTO:=git" >> Makefile
          fi
          # 指定正确的 Git 仓库地址
          if grep -q "^PKG_SOURCE_URL" Makefile; then
            sed -i 's|^PKG_SOURCE_URL:=.*|PKG_SOURCE_URL:=https://github.com/cokebar/vlmcsd|' Makefile
          else
            echo "PKG_SOURCE_URL:=https://github.com/cokebar/vlmcsd" >> Makefile
          fi
          cd $SDK_DIR

      - name: Update feeds and compile vlmcsd
        working-directory: ${{ env.SDK_DIR }}
        run: |
          # ./scripts/feeds update -a
          # ./scripts/feeds install -a
          make defconfig
          make package/vlmcsd/compile V=s

      - name: Find and upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlmcsd-x86_64-apk
          path: ${{ env.SDK_DIR }}/bin/packages/x86_64/base/vlmcsd_*.apk
